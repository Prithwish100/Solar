<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLAR Web Admin Panel • v1.7</title>
  <style>
    :root {
      --bg: #080808;
      --card: #141414;
      --elevated: #1E1E1E;
      --border: #2A2A2A;
      --orange: #FF5500;
      --amber: #FFB347;
      --text: #FFFFFF;
      --muted: #9E9E9E;
      --success: #2ECC71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; max-width: 760px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, rgba(255,85,0,0.22), rgba(20,20,20,0.95));
      border: 1px solid var(--border); border-radius: 18px; padding: 18px 22px; margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .orb {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--amber), var(--orange), #141414);
      box-shadow: 0 0 16px rgba(255,85,0,0.45);
    }
    .brand h1 { font-size: 20px; letter-spacing: 1.5px; font-weight: 800; }
    .brand p { font-size: 12px; color: var(--amber); margin-top: 2px; }
    .badge {
      background: rgba(46, 204, 113, 0.16); color: var(--success);
      border: 1px solid rgba(46, 204, 113, 0.4); padding: 6px 12px;
      border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; }
    .tab-btn {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.18s ease;
    }
    .tab-btn.active {
      background: var(--orange); color: var(--text); border-color: var(--orange);
      box-shadow: 0 4px 14px rgba(255,85,0,0.35);
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px; margin-bottom: 18px;
    }
    .card h2 { font-size: 16px; margin-bottom: 4px; color: var(--text); }
    .card .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--amber); font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--elevated);
      color: var(--text); font-size: 14px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--orange); }
    textarea { min-height: 86px; resize: vertical; }
    .btn-primary {
      width: 100%; margin-top: 18px; padding: 14px; border-radius: 14px;
      border: none; background: linear-gradient(90deg, var(--orange), #FF7700);
      color: var(--text); font-weight: 800; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="orb"></div>
      <div>
        <h1>SOLAR WEB ADMIN PANEL</h1>
        <p>Direct User Notification & OTA Update Console • Version 1.7</p>
      </div>
    </div>
    <span class="badge">FIRESTORE + LOCAL HTTP</span>
  </div>
  <p style="color:#9E9E9E; font-size:13px; margin-bottom:16px;">
    This Web Admin Panel is embedded directly inside SOLAR v1.7 (Log in / Settings &rarr; <b>Open Web Admin Panel</b>) and is also served on <code>http://127.0.0.1:8765</code> while the app is running.
  </p>
</body>
</html>
